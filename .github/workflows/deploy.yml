name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The URL and anon key are public-safe (RLS protects the data), so they
      # are not secrets. Set repository *variables* under
      # Settings → Secrets and variables → Actions → Variables to override the
      # committed defaults below. The fallbacks keep the deployed site
      # connected to its backend even when the variables are unset; both values
      # already ship in the public client bundle, so committing them leaks
      # nothing an anon key is not designed to expose.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://mwtpfsmrrpdcommremkx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13dHBmc21ycnBkY29tbXJlbWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MjEyNDMsImV4cCI6MjEwNzA5NzI0M30.A9m2v2Q5uJH9ciH0l5npO3qo20Xzba8XfyRtZDdO5i0' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4